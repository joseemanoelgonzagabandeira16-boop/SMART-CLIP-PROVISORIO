name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No ZIP project archive found in repository root."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            unzip -o "$archive" -d extracted
          done

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' | head -n 1 || true)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No Gradle wrapper (gradlew) found. The ZIP must contain the complete Android project, including Gradle build files."
            exit 1
          fi
          chmod +x "$WRAPPER"
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-clip-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

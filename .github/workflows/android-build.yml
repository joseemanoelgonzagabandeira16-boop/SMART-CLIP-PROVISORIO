name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -o CREATOR-OS-feature-cut-instruction-text-upload.zip -d extracted
          SETTINGS="$(find extracted -type f -name 'settings.gradle*' | head -n 1)"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
      - name: Apply repository overrides
        run: |
          cp app/src/main/AndroidManifest.xml "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          python3 scripts/apply_source_overrides.py "$PROJECT_DIR"
      - name: Run unit tests and Android lint
        run: gradle --no-daemon -p "$PROJECT_DIR" -PVERSION_CODE=${{ github.run_number }} testDebugUnitTest lintDebug
      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" -PVERSION_CODE=${{ github.run_number }} assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-clip-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload source review
        uses: actions/upload-artifact@v4
        with:
          name: smart-clip-source-review
          path: ${{ env.PROJECT_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
